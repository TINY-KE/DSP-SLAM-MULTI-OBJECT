# #  相机俯视30度   对应gazebo相机移动参数3.5 2 30.0  0.1
Tworld_camera.qw:  0.3535534
Tworld_camera.qx: -0.6123724
Tworld_camera.qy: 0.6123724
Tworld_camera.qz:  -0.3535534
Tworld_camera.tx: 0.0
Tworld_camera.ty: 0.0
Tworld_camera.tz: 1.3  

